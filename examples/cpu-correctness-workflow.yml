# Manual template: copy to .github/workflows/ only if you choose to enable CI.
name: CPU correctness (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 numpy==1.26.4 psutil==7.2.2 accelerate==1.6.0 safetensors==0.8.0
      - name: Independent math, structure and resume checks
        run: python tests.py
